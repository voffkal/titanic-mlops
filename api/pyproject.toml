[project]
name = "titanic-api"
version = "0.1.0"
description = "FastAPI service over the titanic-model predictor"
license = "MIT"
authors = [{ name = "Voffkal" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.3",
    "titanic-model",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
