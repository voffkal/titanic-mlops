[project]
name = "titanic-mlops"
version = "0.0.0"
description = "Kaggle Titanic: slot-based pipeline, frozen model configs, reproducible artifact"
requires-python = ">=3.11"
dependencies = ["titanic-model"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["model"]

[tool.uv.sources]
titanic-model = { workspace = true }

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]

[tool.ruff]
line-length = 100
target-version = "py311"
# workbook/ is research material out of the repository: notebooks with stored
# outputs and legacy scripts. Linting it produces noise, not signal.
extend-exclude = ["workbook"]   # extend-, not exclude=: keeps ruff defaults such as .venv

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501 is covered by the formatter; frozen configs in builders.py are generated
# one-key-per-line and legitimately run long.
ignore = ["E501"]

[tool.ruff.lint.isort]
# the package is installed into .venv, so without this it is sorted as third-party
known-first-party = ["titanic_model"]
known-local-folder = ["conftest"]

[tool.pytest.ini_options]
testpaths = ["model/tests"]
addopts = "-q"
# A warning is a failure by default: a blanket ignore once hid 80% of the
# candidates in a hyperparameter search. The two exceptions below are raised
# inside pinned dependencies and nothing in this repository can act on them.
filterwarnings = [
    "error",
    "ignore:'future.no_silent_downcasting' is deprecated",       # feature_engine
    "ignore:Setting the shape on a NumPy array has been deprecated",  # joblib
]
