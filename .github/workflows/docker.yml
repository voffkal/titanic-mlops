name: docker

on:
  push:
    tags: ["api-v*"]

permissions:
  contents: read
  attestations: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image carries the artifact, and the artifact is not in git: take the
      # newest model release rather than training a second, different one here.
      - name: Fetch the artifacts from the latest model release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --json tagName -q '[.[].tagName | select(startswith("model-v"))][0]')
          test -n "$TAG" || { echo "no model-v* release to build against"; exit 1; }
          echo "using model release: $TAG"
          # the directory is already in the checkout — metrics.json and
          # input_schema.json are tracked — and the release overwrites both
          mkdir -p model_artifacts
          gh release download "$TAG" -D model_artifacts --clobber

      # Before the image is built: the file matches its manifest and came out of
      # our release-model run. Releases cut before the check have no
      # artifact.sha256 and fail here — cut a new model release.
      - name: Verify the model artifact
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: model_artifacts
        run: |
          MODEL=$(jq -r '.artifact.file // empty' metrics.json)
          SHA=$(jq -r '.artifact.sha256 // empty' metrics.json)
          test -n "$MODEL" && test -n "$SHA" || { echo "::error::metrics.json has no artifact.sha256"; exit 1; }
          echo "$SHA  $MODEL" | sha256sum -c -
          gh attestation verify "$MODEL" --repo "$GITHUB_REPOSITORY"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both platforms are available because mlx ships manylinux_2_35 wheels for
      # x86_64 and aarch64; the base image is bookworm, i.e. glibc 2.36.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/voffkal/titanic-api:${{ github.ref_name }}
            ghcr.io/voffkal/titanic-api:latest
