name: release-model

on:
  push:
    tags: ["model-v*"]

permissions:
  contents: write

jobs:
  train-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Kaggle rules: the data is not redistributed, every run fetches it.
      # Only this workflow needs it — the test suite does not.
      - name: Restore dataset cache
        id: data-cache
        uses: actions/cache@v4
        with:
          path: workbook/data/raw
          key: kaggle-titanic-v1

      - name: Fetch the competition data
        if: steps.data-cache.outputs.cache-hit != 'true'
        env:
          KAGGLE_ACCESS_TOKEN: ${{ secrets.KAGGLE_ACCESS_TOKEN }}
        run: |
          mkdir -p ~/.kaggle
          printf '%s' "$KAGGLE_ACCESS_TOKEN" > ~/.kaggle/access_token
          chmod 600 ~/.kaggle/access_token
          mkdir -p workbook/data/raw
          uvx --from kaggle kaggle competitions download -c titanic -p workbook/data
          unzip -o workbook/data/titanic.zip -d workbook/data/raw

      - name: Gate
        run: |
          uv sync --locked
          uv run ruff check .
          uv run pytest

      # The quality gate inside train() refuses to write artifacts below 0.78 CV
      # accuracy, so a broken pipeline fails the release here rather than shipping.
      # --submission: the leaderboard number has to describe the artifact being
      # published. MLX trained on CPU here differs from a Metal run by 2 labels
      # in 418, so a submission produced locally would score a different model.
      - name: Train the release artifact
        run: uv run titanic-train --submission

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(uv run python - <<'PY'
          import json
          m = json.load(open("model_artifacts/metrics.json"))
          cv, base = m["metrics"]["cv"], m["baseline"]
          print(
              f"{m['config']} ({', '.join(m['stack_members'] or [])})\n\n"
              f"CV accuracy {cv['accuracy_mean']:.4f} ± {cv['accuracy_std']:.4f} "
              f"over {cv['n_folds']} folds | roc_auc {cv['roc_auc_mean']:.4f}\n"
              f"OOF accuracy {m['metrics']['oof']['accuracy']:.4f} | "
              f"train-CV gap {m['metrics']['train_cv_gap']:+.4f}\n"
              f"lift over the sex rule {base['cv_lift']:+.4f}\n\n"
              f"sklearn {m['libraries']['scikit-learn']}, xgboost {m['libraries']['xgboost']}, "
              f"mlx {m['libraries']['mlx']}. Trained on the CPU backend here — the MLX "
              f"member is backend-sensitive, so this artifact and its submission.csv "
              f"belong together rather than with a local rebuild."
          )
          PY
          )
          gh release create "$GITHUB_REF_NAME" \
            model_artifacts/titanic_model-*.joblib \
            model_artifacts/input_schema.json \
            model_artifacts/metrics.json \
            model_artifacts/submission.csv \
            --title "$GITHUB_REF_NAME" --notes "$NOTES"

  # Second job rather than a workflow of its own: the Space downloads the release
  # assets at startup, so it must not be rebuilt until the release exists.
  sync-space:
    needs: train-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point the Space at this release
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" || { echo "secret HF_TOKEN is not set"; exit 1; }
          test -n "$HF_SPACE" || { echo "variable HF_SPACE is not set (owner/space)"; exit 1; }

          sed -i "s|\.git@model-v[^#]*#|.git@${GITHUB_REF_NAME}#|" deploy/hf-space/requirements.txt
          grep 'titanic-model @' deploy/hf-space/requirements.txt

          git clone "https://huggingface.co/spaces/$HF_SPACE" space
          cp deploy/hf-space/app.py deploy/hf-space/requirements.txt deploy/hf-space/README.md space/

          cd space
          git config user.name "Voffkal"
          git config user.email "voffkal@hotmail.com"
          git add -A
          git diff --staged --quiet && { echo "the Space already serves this release"; exit 0; }
          git commit -m "serve $GITHUB_REF_NAME"
          git push "https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE" HEAD:main
