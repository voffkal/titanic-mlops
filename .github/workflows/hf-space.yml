name: hf-space

on:
  push:
    tags: ["api-v*"]

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Space is two files pointing at a published image, so a release is
      # deployed by repointing the tag rather than by rebuilding anything.
      - name: Point the Space at this release
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          test -n "$HF_TOKEN" || { echo "secret HF_TOKEN is not set"; exit 1; }
          test -n "$HF_SPACE" || { echo "variable HF_SPACE is not set (owner/space)"; exit 1; }

          sed -i "s|^FROM .*|FROM ghcr.io/voffkal/titanic-api:${GITHUB_REF_NAME}|" \
            deploy/hf-space/Dockerfile
          grep '^FROM ' deploy/hf-space/Dockerfile

          git clone "https://huggingface.co/spaces/$HF_SPACE" space
          cp deploy/hf-space/Dockerfile deploy/hf-space/README.md space/

          cd space
          git config user.name "Voffkal"
          git config user.email "voffkal@hotmail.com"
          git add -A
          git diff --staged --quiet && { echo "the Space already serves this release"; exit 0; }
          git commit -m "serve $GITHUB_REF_NAME"
          # token goes on the push URL only, never into a tracked remote
          git push "https://user:$HF_TOKEN@huggingface.co/spaces/$HF_SPACE" HEAD:main
